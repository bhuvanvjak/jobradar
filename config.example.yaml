# ---- who gets the digest ----
email:
  to: you@example.com
  from: bhuvanesh9139@gmail.com        # the Gmail account that sends
  smtp_host: smtp.gmail.com
  smtp_port: 587
  # password comes from the env var JOBRADAR_SMTP_PASSWORD (Gmail App Password)

# ---- your resume ----
resume_path: resume.pdf                # your CV, gitignored

# ---- companies you want watched ----
# board: greenhouse | lever | ashby | workable | workday | oracle
# slug:  the company handle on that board
companies:
  - { name: 'Anthropic', board: greenhouse, slug: 'anthropic', domain: anthropic.com }
  - { name: 'Stripe', board: greenhouse, slug: 'stripe', domain: stripe.com }
  - { name: 'Notion', board: ashby, slug: 'notion', domain: notion.so }
  - { name: 'Figma', board: greenhouse, slug: 'figma', domain: figma.com }
  - { name: 'Databricks', board: greenhouse, slug: 'databricks', domain: databricks.com }
  - { name: 'Ramp', board: ashby, slug: 'ramp', domain: ramp.com }
  - { name: 'HackerRank', board: greenhouse, slug: 'hackerrank', domain: hackerrank.com }
  - { name: 'Adobe', board: workday, slug: 'adobe/wd5/external_experienced', domain: adobe.com }
  - { name: 'NVIDIA', board: workday, slug: 'nvidia/wd5/NVIDIAExternalCareerSite', domain: nvidia.com }
  - { name: 'Salesforce', board: workday, slug: 'salesforce/wd12/External_Career_Site', domain: salesforce.com }
  - { name: 'Fidelity', board: workday, slug: 'fmr/wd1/FidelityCareers', domain: fidelity.com }
  - { name: 'Oracle', board: oracle, slug: 'eeho.fa.us2.oraclecloud.com/CX_1', domain: oracle.com }
  - { name: 'Dell', board: oracle, slug: 'enterpriseplatform.dell.com/CX_1', domain: dell.com }
  - { name: 'Atlassian', board: atlassian, slug: 'atlassian', domain: atlassian.com }

  # ---- India-heavy engineering hubs ----
  # Every slug below was hit live and confirmed to (a) return real open
  # postings and (b) actually be the intended company - board APIs have
  # name collisions (e.g. lever/porter is a Massachusetts healthcare
  # staffing firm, not the Indian logistics company; greenhouse/slice is a
  # Balkans customer-support shop, not the Indian fintech). Verify any
  # slug you add the same way: curl the board URL and read a few job
  # locations before trusting a guess.
  - { name: 'Groww', board: greenhouse, slug: 'groww', domain: groww.in }
  - { name: 'Meesho', board: lever, slug: 'meesho', domain: meesho.com }
  - { name: 'Zeta', board: lever, slug: 'zeta', domain: zeta.tech }
  - { name: 'MindTickle', board: lever, slug: 'mindtickle', domain: mindtickle.com }
  - { name: 'Netskope', board: greenhouse, slug: 'netskope', domain: netskope.com }
  - { name: 'Druva', board: greenhouse, slug: 'druva', domain: druva.com }
  - { name: 'Zscaler', board: greenhouse, slug: 'zscaler', domain: zscaler.com }
  - { name: 'HighRadius', board: greenhouse, slug: 'highradius', domain: highradius.com }
  - { name: 'InMobi', board: greenhouse, slug: 'inmobi', domain: inmobi.com }

# ---- broad discovery from free aggregators ----
discovery:
  enabled: true
  queries: ["full stack developer", "react developer", "node.js",
            "backend engineer", "python developer", "ai engineer"]
  max_per_query: 40
  expire_after_days: 4                 # aggregators give no "still open" signal,
                                       # so a listing not re-seen in this long
                                       # is treated as expired

# ---- filtering ----
filters:
  # keep a job only if its title matches one of these (case-insensitive substrings).
  # empty list = keep everything.
  title_include: ["engineer", "developer", "scientist", "intern", "analyst",
                  "graduate", "fresher"]
  title_exclude: ["staff", "principal", "director", "manager", "vp ",
                  "head of", "lead ", "architect", "10+ years",
                  "forward deployed"]
  # e.g. ["india", "bangalore", "remote"]; empty = anywhere. Filtering by
  # location here (before scoring) also saves LLM tokens on postings you'd
  # never take anyway.
  locations: []
  # A job is dropped if its own description states it needs more years than
  # this - catches postings a title alone doesn't reveal as senior. Matches
  # "3+ years experience", "5 years professional experience", etc. - not
  # every possible phrasing, but most of them. Set to null to disable.
  max_years_required: 2

# ---- decision model ----
llm:
  # groq - free tier, no card required (key at console.groq.com/home).
  # Also supported: xkiro, openrouter, ollama (local) - see jobradar/llm.py.
  provider: groq
  model: openai/gpt-oss-120b

  min_score: 6                  # 0-10; only jobs at/above this get emailed

  # --- token economy -----------------------------------------------------
  # The free tier is a fixed daily budget. Three things keep a full board
  # inside it:
  #   triage      - score obviously-hopeless jobs locally for free, so only
  #                 plausible ones cost tokens (roughly halves the work)
  #   batch_size  - one request per N jobs, so per-call overhead is amortised
  #   the budget  - the scan stops while there is still room, and resumes
  #                 next run; it never exhausts the key
  triage: true                  # settle hopeless matches locally and free;
                                # set false if it scores good matches too low
  triage_floor: 3               # local score below this is settled locally
  batch_size: 15                # smaller batches fit a free-tier TPM cap
  tokens_per_batch: 3400        # observed 2.1k-5.2k; the per-batch gate is the real guard
  daily_token_limit: 150000     # conservative; raise once you've checked your
                                # provider's actual daily cap
  max_to_score: 5000


# ---- email digest ----
digest:
  max_jobs: 60                         # most jobs one email will list

# ---- same-day alerts ----
# The weekly digest is for browsing. This is for employers where a week's
# delay costs you something: checked hourly, mailed the moment a role appears.
alerts:
  # Checked daily. Keep this short - the daily run fetches only these, so a
  # shortlist is seconds of work where all 55 would be half an hour.
  companies: [Adobe, Oracle, Atlassian]   # checked daily; keep it short
  min_score: 6                         # unscored jobs always alert
  max_per_alert: 15

# ============================================================
# ---- auto-apply module (built on top of jobradar's scan) ----
# ============================================================
# Runs on top of the jobs jobradar has already found and scored. Picks the
# best unapplied jobs at/above apply.min_score, tailors your resume and
# writes a cover letter or cold email for each with an LLM, then either
# sends the cold email directly or queues the job-board application for
# your one-click review (job-board sites are never auto-submitted - see
# README). Everything is logged to Notion.
apply:
  enabled: true
  jobs_per_batch: 5            # x2 scheduled runs/day = 10 applications/day
  min_score: 6                 # only auto-apply to jobs scored >= this

  candidate:
    name: "Your Full Name"
    email: "you@example.com"
    phone: "+91-XXXXXXXXXX"
    location: "Bangalore, India"
    linkedin: ""
    github: ""

  # Model that writes the resume/cover letter/cold email text that
  # actually reaches an employer. Separate from llm.* above (which only
  # scores fit) so you can point this at a stronger model if you want.
  tailor_llm:
    provider: groq                 # groq | anthropic
    model: openai/gpt-oss-120b     # or e.g. claude-haiku-4-5 on anthropic

  cold_email:
    enabled: true
    # You source these contacts yourself - nothing here scrapes or
    # guesses addresses. See data/target_companies.csv.
    contacts_file: "data/target_companies.csv"
    max_per_batch: 2
    send_automatically: true     # false = draft only, hold in review queue
    # sent via the [email] block above - set email.from/smtp_host there
    # and JOBRADAR_SMTP_PASSWORD in your environment

  notion:
    enabled: true                # requires NOTION_TOKEN / NOTION_DATABASE_ID
                                  # in your environment - see README
